# DXVK Configuration for Autodesk Fusion 360
# Optimizations for NVIDIA discrete GPU + Hybrid XWayland / KDE Wayland (120Hz VRR)

# 1. Frame pacing & presentation for 120Hz display
# syncInterval = 0 with tearFree = True activates Vulkan Mailbox presentation mode
# (delivers the freshest rendered frame at 120Hz refresh without tearing or vsync queue stalls)
dxgi.syncInterval = 0
dxvk.tearFree = True

# 2. Match panel refresh rate to prevent XWayland compositor buffer judder
dxgi.maxFrameRate = 120
dxvk.maxFrameRate = 120

# 3. Minimize input lag during 3D orbit/pan/zoom (1-frame queue instead of 3)
dxgi.maxFrameLatency = 1
d3d11.maxFrameLatency = 1

# 4. Pipeline & barrier optimization for high-fidelity effects (AO, shadows, reflections)
d3d11.relaxedBarriers = True
d3d11.relaxedGraphicsBarriers = True

# 5. Multi-threaded shader & pipeline compilation across CPU cores
dxvk.numCompilerThreads = 8
dxvk.enableGraphicsPipelineLibrary = True
dxvk.enableMemoryDefrag = True
